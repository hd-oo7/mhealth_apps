services:
  mscan:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mscan:latest
    environment:
      - ADB_SERVER_SOCKET=tcp:host.docker.internal:5038
      - ANDROID_ADB_SERVER_HOST=host.docker.internal
      - ANDROID_ADB_SERVER_PORT=5038
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Publishes the container's mitmproxy port to the host so the
      # emulator's `-http-proxy 127.0.0.1:8080` traffic (see docker/README.md)
      # actually reaches it. Only needed for the network_traffic source.
      - "8080:8080"
    volumes:
      - ../results:/app/mscan/results
      - ../data/network_traffic:/app/data/network_traffic
      - ../data/privacy_policies:/app/data/privacy_policies
      # mitmproxy's CA subject name (CN=mitmproxy) -- and so its Android
      # system-cacerts filename, which is a hash of the subject, not the key
      # -- is the same across every fresh install, but the actual key pair
      # is regenerated at random each time mitmdump starts with no existing
      # CA. Without this volume, every `docker run --rm` (no persistence)
      # gets its own new key while docker/setup_device.py's install check
      # only looks for a same-named file on the device and reports
      # "already installed" -- so interception silently breaks (cert/key
      # mismatch) on every run after the first. Confirmed empirically: two
      # separate container runs produced certs with identical subject_hash_old
      # (c8750f0d) but different SHA1 fingerprints. This volume makes the
      # container reuse the same CA every run, matching whatever's already
      # trusted on the device.
      - ../data/mitmproxy_ca:/root/.mitmproxy
    # --out is a filename PREFIX, not a directory (mscan writes
    # <out>_<country>.jsonl) -- point it inside the mounted results/ volume
    # above so output actually survives the container exiting, and mount
    # your own CSV/txt of app_ids at run time, e.g.:
    #   docker compose run --rm -v $(pwd)/my_apps.csv:/app/mscan/app_ids.csv:ro \
    #       mscan --app-ids-file app_ids.csv --country us --out /app/mscan/results/results
